[book]
title = "AI Infra 推理引擎知识全书"
description = "面向训推平台/推理引擎研发工程师的 LLM 推理基础设施知识手册：从基础概念、vLLM/SGLang 源码，到生产部署与边缘 AI。"
language = "zh"
authors = ["AI Infra Collect"]

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/Atituiset/ai-infra"
edit-url-template = "https://github.com/Atituiset/ai-infra/edit/master/{path}"

[build]
create-missing = false
